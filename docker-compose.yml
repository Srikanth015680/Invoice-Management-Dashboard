services:
  backend:
    build:
      context: ./backend
    container_name: invoice-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
    container_name: invoice-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend